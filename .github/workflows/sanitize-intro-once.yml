name: Sanitize intro ending (one-time)
on:
  push:
    branches:
      - chore/restore-remotion-and-video
    paths:
      - .github/workflows/sanitize-intro-once.yml
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install video tools and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk
      - name: Replace outdated URL/QR outro with credit slate
        run: |
          bash project/video/capture/sanitize-intro.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('project/public/intro.vtt')
          text = path.read_text(encoding='utf-8')
          marker = '\n00:00:56.178 --> '
          if marker not in text:
              raise SystemExit('Caption timing changed; refusing automatic trim')
          path.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY
      - name: Commit updated intro asset to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/public/intro.mp4 project/public/intro.vtt
          git diff --cached --quiet && exit 1
          git commit -m "fix(video): remove obsolete URL and QR from intro"
          git push origin HEAD:chore/restore-remotion-and-video
